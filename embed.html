<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MODE — Video.js v10 Studio Player</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #studio-mode-mount {
        width: 100%;
        height: 100%;
      }
      #studio-mode-mount > .mode-v10-player-host {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
      }
      #studio-mode-mount media-i18n {
        display: contents;
      }
      #studio-mode-mount .vjs-mode-skin {
        width: 100%;
        height: 100%;
        min-height: 0;
        max-height: 100%;
        aspect-ratio: auto;
        overflow: hidden;
      }
      #studio-mode-mount .vjs-mode-skin:not(:fullscreen) {
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <div id="studio-mode-mount"></div>
    <script type="module" src="/src/embed.ts"></script>
  </body>
</html>
